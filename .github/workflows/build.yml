name: Build (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=CIBA_SECRET=${{ secrets.CIBA_SECRET }}
      - name: Package .app
        run: |
          cd build/macos/Build/Products/Release
          zip -qr cibademo-macos.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: cibademo-macos
          path: build/macos/Build/Products/Release/cibademo-macos.zip
